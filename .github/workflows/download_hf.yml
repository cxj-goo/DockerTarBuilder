name: Download and Package HF Model

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'HuggingFace模型名称'
        required: true
        default: 'BAAI/bge-m3'
        type: string
      exclude_patterns:
        description: '排除的文件模式'
        required: false
        default: '*.h5,*.ot,*.msgpack,colbert_linear.pt,sparse_linear.pt'
        type: string
      compression_method:
        description: '压缩方式'
        required: false
        default: 'gzip'
        type: choice
        options:
          - 'none (仅打包，最快)'
          - 'gzip (快速)'
          - 'xz (高压缩率，最慢)'
      compression_level:
        description: '压缩级别 (仅对gzip/xz有效)'
        required: false
        default: '3'
        type: choice
        options:
          - '0 (最快)'
          - '3 (平衡)'
          - '6 (默认)'
          - '9 (最高压缩)'

jobs:
  download-and-package:
    runs-on: ubuntu-latest
    
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install huggingface-hub
    
    - name: Download model from HuggingFace
      env:
        MODEL_NAME: ${{ github.event.inputs.model_name }}
        EXCLUDE_PATTERNS: ${{ github.event.inputs.exclude_patterns }}
      run: |
        python -c "
        from huggingface_hub import snapshot_download
        import os
        import time
        from datetime import datetime
        
        model_name = os.environ['MODEL_NAME']
        exclude = os.environ.get('EXCLUDE_PATTERNS', '')
        exclude_patterns = [p.strip() for p in exclude.split(',') if p.strip()]
        
        print('=' * 60)
        print(f'模型名称: {model_name}')
        print(f'开始时间: {datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")}')
        print(f'排除模式: {exclude_patterns if exclude_patterns else \"无\"}')
        print('=' * 60)
        
        start_time = time.time()
        
        safe_name = model_name.replace('/', '_')
        
        try:
            snapshot_download(
                repo_id=model_name,
                local_dir=f'./{safe_name}-model',
                local_dir_use_symlinks=False,
                resume_download=True,
                ignore_patterns=exclude_patterns if exclude_patterns else None,
                max_workers=4,
                token=None
            )
            
            end_time = time.time()
            print('=' * 60)
            print(f'下载完成！耗时: {(end_time - start_time) / 60:.2f} 分钟')
            
            model_dir = f'./{safe_name}-model'
            if os.path.exists(model_dir):
                total_size = 0
                files = os.listdir(model_dir)
                for f in files:
                    size = os.path.getsize(os.path.join(model_dir, f))
                    total_size += size
                    print(f'  {f} ({size / (1024*1024):.2f} MB)')
                
                print(f'\n总大小: {total_size / (1024*1024):.2f} MB')
            else:
                print('错误: 模型目录不存在')
                exit(1)
                
        except Exception as e:
            print(f'下载失败: {e}')
            exit(1)
        "
    
    - name: Get model info
      id: model_info
      run: |
        MODEL_NAME="${{ github.event.inputs.model_name }}"
        SAFE_NAME="${MODEL_NAME//\//_}"
        echo "safe_name=$SAFE_NAME" >> $GITHUB_OUTPUT
        echo "model_dir=./${SAFE_NAME}-model" >> $GITHUB_OUTPUT
        echo "archive_name=${SAFE_NAME}-model" >> $GITHUB_OUTPUT
        
        if [ -d "./${SAFE_NAME}-model" ]; then
          SIZE=$(du -sh "./${SAFE_NAME}-model" | cut -f1)
          echo "model_size=$SIZE" >> $GITHUB_OUTPUT
        fi
    
    - name: Compress model
      env:
        METHOD: ${{ github.event.inputs.compression_method }}
        LEVEL: ${{ github.event.inputs.compression_level }}
        ARCHIVE_NAME: ${{ steps.model_info.outputs.archive_name }}
        MODEL_DIR: ${{ steps.model_info.outputs.model_dir }}
      run: |
        echo "========================================"
        echo "开始压缩..."
        echo "压缩方式: $METHOD"
        echo "压缩级别: $LEVEL"
        echo "========================================"
        
        case "$METHOD" in
          "none (仅打包，最快)")
            echo "使用 tar (无压缩)..."
            time tar -cf "${ARCHIVE_NAME}.tar" "$MODEL_DIR"
            FINAL_FILE="${ARCHIVE_NAME}.tar"
            ;;
          "gzip (快速)")
            LEVEL_NUM=$(echo "$LEVEL" | cut -d' ' -f1)
            echo "使用 gzip (级别 $LEVEL_NUM)..."
            time tar -czf "${ARCHIVE_NAME}.tar.gz" --gzip-options="-$LEVEL_NUM" "$MODEL_DIR"
            FINAL_FILE="${ARCHIVE_NAME}.tar.gz"
            ;;
          "xz (高压缩率，最慢)")
            LEVEL_NUM=$(echo "$LEVEL" | cut -d' ' -f1)
            echo "使用 xz (级别 $LEVEL_NUM)..."
            export XZ_OPT="-$LEVEL_NUM"
            time tar -cJf "${ARCHIVE_NAME}.tar.xz" "$MODEL_DIR"
            FINAL_FILE="${ARCHIVE_NAME}.tar.xz"
            ;;
        esac
        
        echo "========================================"
        echo "压缩完成！"
        echo "输出文件: $FINAL_FILE"
        echo "文件大小: $(du -h "$FINAL_FILE" | cut -f1)"
        echo "========================================"
        
        # 保存文件名供后续步骤使用
        echo "final_file=$FINAL_FILE" >> $GITHUB_ENV
    
    - name: Generate checksums
      id: checksum
      run: |
        FINAL_FILE="${{ env.final_file }}"
        
        sha256sum "$FINAL_FILE" > "${FINAL_FILE}.sha256"
        md5sum "$FINAL_FILE" > "${FINAL_FILE}.md5"
        
        SHA256=$(sha256sum "$FINAL_FILE" | cut -d' ' -f1)
        MD5=$(md5sum "$FINAL_FILE" | cut -d' ' -f1)
        echo "sha256=$SHA256" >> $GITHUB_OUTPUT
        echo "md5=$MD5" >> $GITHUB_OUTPUT
        
        printf '%s\n' \
          "========================================" \
          "模型下载信息" \
          "========================================" \
          "模型名称: ${{ github.event.inputs.model_name }}" \
          "下载时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
          "压缩文件: $FINAL_FILE" \
          "SHA256: $SHA256" \
          "MD5: $MD5" \
          "文件大小: $(du -h "$FINAL_FILE" | cut -f1)" \
          "原始大小: ${{ steps.model_info.outputs.model_size }}" \
          "GitHub仓库: ${{ github.repository }}" \
          "运行ID: ${{ github.run_id }}" \
          "========================================" > model-info.txt
        
        cat model-info.txt
    
    - name: Upload artifact (7 days retention)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.model_info.outputs.safe_name }}-model
        path: |
          ${{ env.final_file }}
          ${{ env.final_file }}.sha256
          ${{ env.final_file }}.md5
          model-info.txt
        retention-days: 7
        compression-level: 0
    
    - name: Display download link
      run: |
        echo "========================================"
        echo "✅ 模型打包完成！"
        echo "========================================"
        echo "📦 模型: ${{ github.event.inputs.model_name }}"
        echo "📁 文件: ${{ env.final_file }}"
        echo "🔗 下载: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "========================================"
        echo "📋 校验信息:"
        echo "   SHA256: ${{ steps.checksum.outputs.sha256 }}"
        echo "   MD5:    ${{ steps.checksum.outputs.md5 }}"
        echo "========================================"
        echo "⏰ Artifact将保留7天后自动删除"
        echo "========================================"
