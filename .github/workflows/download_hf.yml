name: Download and Package HF Model

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'HuggingFace模型名称 (例如: BAAI/bge-m3)'
        required: true
        default: 'BAAI/bge-m3'
        type: string
      exclude_patterns:
        description: '排除的文件模式 (逗号分隔，例如: *.h5,*.ot)'
        required: false
        default: '*.h5,*.ot,*.msgpack,colbert_linear.pt,sparse_linear.pt'
        type: string
      compression_level:
        description: '压缩级别 (0-9, 9最高压缩率但最慢)'
        required: false
        default: '6'
        type: choice
        options:
          - '0'
          - '1'
          - '3'
          - '6'
          - '9'

jobs:
  download-and-package:
    runs-on: ubuntu-latest
    
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install huggingface-hub
    
    - name: Download model from HuggingFace
      env:
        MODEL_NAME: ${{ github.event.inputs.model_name }}
        EXCLUDE_PATTERNS: ${{ github.event.inputs.exclude_patterns }}
      run: |
        python -c "
        from huggingface_hub import snapshot_download
        import os
        import time
        from datetime import datetime
        
        model_name = os.environ['MODEL_NAME']
        exclude = os.environ.get('EXCLUDE_PATTERNS', '')
        exclude_patterns = [p.strip() for p in exclude.split(',') if p.strip()]
        
        print('=' * 60)
        print(f'模型名称: {model_name}')
        print(f'开始时间: {datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")}')
        print(f'排除模式: {exclude_patterns if exclude_patterns else \"无\"}')
        print('=' * 60)
        
        start_time = time.time()
        
        # 清理模型名称中的特殊字符用于文件名
        safe_name = model_name.replace('/', '_')
        
        try:
            snapshot_download(
                repo_id=model_name,
                local_dir=f'./{safe_name}-model',
                local_dir_use_symlinks=False,
                resume_download=True,
                ignore_patterns=exclude_patterns if exclude_patterns else None,
                max_workers=4,
                token=None
            )
            
            end_time = time.time()
            print('=' * 60)
            print(f'下载完成！')
            print(f'耗时: {(end_time - start_time) / 60:.2f} 分钟')
            
            # 显示下载的文件
            model_dir = f'./{safe_name}-model'
            if os.path.exists(model_dir):
                total_size = 0
                files = []
                for root, dirs, filenames in os.walk(model_dir):
                    for filename in filenames:
                        filepath = os.path.join(root, filename)
                        size = os.path.getsize(filepath)
                        total_size += size
                        files.append((filename, size))
                
                print(f'\n下载的文件 ({len(files)} 个):')
                for filename, size in sorted(files, key=lambda x: x[1], reverse=True)[:20]:
                    print(f'  - {filename} ({size / (1024*1024):.2f} MB)')
                
                if len(files) > 20:
                    print(f'  ... 还有 {len(files) - 20} 个文件')
                
                print(f'\n总大小: {total_size / (1024*1024):.2f} MB')
                print(f'保存路径: {model_dir}')
            else:
                print('错误: 模型目录不存在')
                exit(1)
                
        except Exception as e:
            print(f'下载失败: {e}')
            exit(1)
        "
    
    - name: Get model info
      id: model_info
      run: |
        MODEL_NAME="${{ github.event.inputs.model_name }}"
        SAFE_NAME="${MODEL_NAME//\//_}"
        echo "safe_name=$SAFE_NAME" >> $GITHUB_OUTPUT
        echo "model_dir=./${SAFE_NAME}-model" >> $GITHUB_OUTPUT
        echo "archive_name=${SAFE_NAME}-model.tar.xz" >> $GITHUB_OUTPUT
        
        # 获取模型目录大小
        if [ -d "./${SAFE_NAME}-model" ]; then
          SIZE=$(du -sh "./${SAFE_NAME}-model" | cut -f1)
          echo "model_size=$SIZE" >> $GITHUB_OUTPUT
        fi
    
    - name: Compress to tar.xz
      env:
        COMPRESSION_LEVEL: ${{ github.event.inputs.compression_level }}
        ARCHIVE_NAME: ${{ steps.model_info.outputs.archive_name }}
        MODEL_DIR: ${{ steps.model_info.outputs.model_dir }}
      run: |
        echo "正在压缩模型..."
        echo "源目录: $MODEL_DIR"
        echo "压缩级别: $COMPRESSION_LEVEL"
        echo "输出文件: $ARCHIVE_NAME"
        
        # 使用环境变量设置压缩级别
        export XZ_OPT="-$COMPRESSION_LEVEL"
        time tar -cJf "$ARCHIVE_NAME" "$MODEL_DIR"
        
        echo "压缩完成！"
        echo "压缩包大小: $(du -h "$ARCHIVE_NAME" | cut -f1)"
        
        # 计算压缩率
        if [ -d "$MODEL_DIR" ] && [ -f "$ARCHIVE_NAME" ]; then
          ORIGINAL_SIZE=$(du -sb "$MODEL_DIR" | cut -f1)
          COMPRESSED_SIZE=$(du -sb "$ARCHIVE_NAME" | cut -f1)
          RATIO=$(echo "scale=2; $COMPRESSED_SIZE * 100 / $ORIGINAL_SIZE" | bc)
          echo "压缩率: ${RATIO}%"
        fi
    
    - name: Generate checksums
      id: checksum
      run: |
        ARCHIVE_NAME="${{ steps.model_info.outputs.archive_name }}"
        
        # 生成多种校验和
        sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
        md5sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.md5"
        
        # 保存到输出
        SHA256=$(sha256sum "$ARCHIVE_NAME" | cut -d' ' -f1)
        MD5=$(md5sum "$ARCHIVE_NAME" | cut -d' ' -f1)
        echo "sha256=$SHA256" >> $GITHUB_OUTPUT
        echo "md5=$MD5" >> $GITHUB_OUTPUT
        
        # 创建信息文件（使用printf避免heredoc问题）
        printf '%s\n' \
          "========================================" \
          "模型下载信息" \
          "========================================" \
          "模型名称: ${{ github.event.inputs.model_name }}" \
          "下载时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
          "压缩文件: $ARCHIVE_NAME" \
          "SHA256: $SHA256" \
          "MD5: $MD5" \
          "文件大小: $(du -h "$ARCHIVE_NAME" | cut -f1)" \
          "原始大小: ${{ steps.model_info.outputs.model_size }}" \
          "GitHub仓库: ${{ github.repository }}" \
          "运行ID: ${{ github.run_id }}" \
          "========================================" > model-info.txt
        
        cat model-info.txt
    
    - name: Upload artifact (7 days retention)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.model_info.outputs.safe_name }}-model
        path: |
          ${{ steps.model_info.outputs.archive_name }}
          ${{ steps.model_info.outputs.archive_name }}.sha256
          ${{ steps.model_info.outputs.archive_name }}.md5
          model-info.txt
        retention-days: 7
        compression-level: 0
    
    - name: Display download link
      run: |
        echo "========================================"
        echo "✅ 模型打包完成！"
        echo "========================================"
        echo "📦 模型: ${{ github.event.inputs.model_name }}"
        echo "📁 文件: ${{ steps.model_info.outputs.archive_name }}"
        echo "🔗 下载: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "========================================"
        echo "📋 校验信息:"
        echo "   SHA256: ${{ steps.checksum.outputs.sha256 }}"
        echo "   MD5:    ${{ steps.checksum.outputs.md5 }}"
        echo "========================================"
        echo "⏰ Artifact将保留7天后自动删除"
        echo "========================================"
