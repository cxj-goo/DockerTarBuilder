name: Download Offline Dependencies

on:
  workflow_dispatch:

jobs:
  download-deps:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download pip dependencies
        run: |
          pip download \
            nvidia-cudnn-cu12==9.1.0.70 \
            triton==3.2.0 \
            -d ./offline_deps

      - name: Upload offline dependencies as artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-deps
          path: ./offline_deps/
          retention-days: 7
